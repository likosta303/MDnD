function showPage(key,fromSuccessfulJoin=false){
 if(key!=='table'&&window.__vttActiveSession){const home=document.getElementById('app-home');try{home.contentWindow.postMessage({type:'vtt-leave-session',sessionId:window.__vttActiveSession.id},'*')}catch(err){}window.__vttActiveSession=null;}

 document.querySelectorAll('.app').forEach(f=>f.classList.toggle('active',f.id==='app-'+key));
 document.title=({home:'VTT — Главная',characters:'VTT — Персонажи D&D 2014',bestiary:'VTT — Бестиарий',table:'VTT — Игровой стол'})[key]||'VTT';
 if(key==='table'&&window.__vttActiveSession){const frame=document.getElementById('app-table');try{frame.contentWindow.postMessage({type:'vtt-session-context',session:window.__vttActiveSession},'*')}catch(e){}}
}

document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
const editorOverlay=document.getElementById('editorOverlay'),editorOverlayFrame=document.getElementById('editorOverlayFrame'),editorOverlayTitle=document.getElementById('editorOverlayTitle');
function openEditorOverlay(editor){const key=editor==='bestiary'?'bestiary':'characters';editorOverlayTitle.textContent=key==='bestiary'?'Бестиарий — создание и редактирование существа':'D&D 5e (2014) — полный лист персонажа';editorOverlayFrame.srcdoc=decodeURIComponent(escape(atob(sources[key])));editorOverlay.classList.add('open');document.body.style.overflow='hidden';}
function closeEditorOverlay(){editorOverlay.classList.remove('open');document.body.style.overflow='hidden';editorOverlayFrame.srcdoc='';const home=document.getElementById('app-home');try{home.contentWindow.postMessage({type:'vtt-editor-closed'},'*')}catch(e){} }
document.getElementById('closeEditorOverlay').addEventListener('click',closeEditorOverlay);
window.addEventListener('message',e=>{if(e.data&&e.data.type==='vtt-open-editor'){openEditorOverlay(e.data.editor)}});

// Characters and bestiary are kept as tabs inside the main screen. The table can only be opened after a successful session join.
</script></body></html>
