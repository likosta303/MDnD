for(const [key,data] of Object.entries(sources)){const frame=document.getElementById('app-'+key);frame.srcdoc=decodeURIComponent(escape(atob(data)));}
function showPage(key){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===key));document.querySelectorAll('.app').forEach(f=>f.classList.toggle('active',f.id==='app-'+key));document.title=({home:'VTT — Главная',table:'VTT — Игровой стол',characters:'VTT — Персонажи',bestiary:'VTT — Бестиарий'})[key]||'VTT';}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
document.getElementById('fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}});
document.getElementById('helpBtn').addEventListener('click',()=>alert('VTT — виртуальный игровой стол для фэнтези-приключений. Используй верхнее меню для перехода между главной страницей, игровым столом, персонажами и бестиарием. Данные сохраняются в локальном хранилище браузера.'));
// Connect the home-page shortcuts to the unified navigation when they are clicked.
document.getElementById('app-home').addEventListener('load',()=>{try{const d=document.getElementById('app-home').contentDocument;d.addEventListener('click',e=>{const el=e.target.closest('button,a,[role="button"]');if(!el)return;const t=(el.innerText||el.textContent||'').trim().toLowerCase();if(t==='♙ персонажи'||t==='персонажи'){e.preventDefault();showPage('characters')}else if(t==='♜ бестиарий'||t==='бестиарий'){e.preventDefault();showPage('bestiary')}else if(t==='игровой стол'||t==='открыть мир'){e.preventDefault();showPage('table')}} ,true)}catch(e){}});
</script></body></html>
